[[suppress]]
file = "src/forja/checks/adr_trigger.py"
function = "AdrCheck._judge"
change = "delete -"
reason = "The path is built as docs/adr/<name>, so it always has a slash and rsplit gives exactly two parts: index -1 and index 1 are the same one."

[[suppress]]
file = "src/forja/checks/comments.py"
