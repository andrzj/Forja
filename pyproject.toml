[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forja"
version = "0.0.0"
description = "Drives coding-agent CLIs and gates their output with deterministic checks."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/forja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs that start many processes; run them before every release"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
