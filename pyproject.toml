[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forja"
version = "0.0.0"
description = "Drives coding-agent CLIs and gates their output with deterministic checks."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "lizard>=1.24.1",
]
mutation = [
    "mutmut>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that start many processes; run them before every release",
    "tools: needs an external tool (gitleaks); skipped when it is not installed",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.mutmut]
source_paths = [
    "src/forja/core/",
    "src/forja/orchestrator/",
    "src/forja/checks/",
    "src/forja/languages/",
]
pytest_add_cli_args_test_selection = ["tests/"]
timeout_multiplier = 4
# The three deselected tests fail on Linux today (see docs/estado.md) and are outside the
# modules under mutation; the self-scan reads source that mutmut rewrites; mutmut needs a green baseline run.
pytest_add_cli_args = [
    "-m", "not slow", "-p", "no:cacheprovider",
    "--deselect", "tests/core/gitguard/test_snapshot.py::test_a_fetch_that_moves_remote_tracking_refs_is_a_change",
    "--deselect", "tests/core/locking/test_index_locks.py::test_the_real_process_list_includes_this_process_and_no_invented_names",
    "--deselect", "tests/core/redaction/test_secrets.py::test_forjas_own_source_is_clean",
    "--deselect", "tests/core/locking/test_repository.py::test_the_repository_id_is_short_stable_and_shared_by_every_worktree",
]
